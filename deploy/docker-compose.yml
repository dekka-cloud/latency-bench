# One latency-bench target. Copy deploy/.env.example to deploy/.env, describe where this
# machine is, and run `docker compose up -d` from deploy/.
#
# With no domain the target serves HTTPS with a self-signed certificate, which the probe
# measures with --insecure. Browsers need a real certificate: point a domain at this machine,
# set DOMAIN in .env and run `docker compose --profile tls up -d`, and Caddy gets one from
# Let's Encrypt and serves the target on port 443.
services:
  target:
    build:
      context: ..
    image: latency-bench-target
    restart: unless-stopped
    environment:
      BENCH_LOCATION: ${BENCH_LOCATION:?say where this machine is, such as "Frankfurt, Germany"}
      BENCH_PROVIDER: ${BENCH_PROVIDER:?say who hosts it}
      BENCH_HOSTNAME: ${DOMAIN:-}
      BENCH_TARGETS: /config/targets.json
      BENCH_COLLECT: ${BENCH_COLLECT:-}
    volumes:
      - ./targets.json:/config/targets.json:ro
      - results:/data
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
      - "7001:7001/udp"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  caddy:
    profiles: [tls]
    image: caddy:2
    restart: unless-stopped
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN to use the tls profile} --to target:8080
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data

volumes:
  results:
  caddy:
